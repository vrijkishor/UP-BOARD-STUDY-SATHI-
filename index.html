<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>UP BOARD STUDY SATHI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#2563eb;color:#fff;padding:18px}main{max-width:850px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card,.box{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.card{cursor:pointer}button{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:bold;margin:4px}.secondary{background:#e7eefc;color:#17439a}.muted{color:#667085;font-size:13px}input,textarea{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:10px;margin:7px 0}.option{display:block;background:#eef3ff;padding:10px;border-radius:9px;margin:7px 0}.progress{height:10px;background:#ddd;border-radius:8px}.bar{height:100%;background:#2563eb;border-radius:8px}</style></head><body>
<header><h1>📚 UP BOARD STUDY SATHI</h1><small>कक्षा 9–12 • Notes • MCQ • Doubt Solver</small></header><main id="app"></main><script>
const subjects={9:["Hindi","English","Mathematics","Science","Social Science"],10:["Hindi","English","Mathematics","Science","Social Science"],11:["Hindi","English","Physics","Chemistry","Mathematics","Biology"],12:["Hindi","English","Physics","Chemistry","Mathematics","Biology"]};
let st=JSON.parse(localStorage.getItem("studySathi")||'{"lessons":0,"tests":0}');function save(){localStorage.setItem("studySathi",JSON.stringify(st))}
function home(){app.innerHTML='<div class="box"><h2>नमस्ते 👋</h2><p>अपनी कक्षा चुनें:</p><div class="grid">'+[9,10,11,12].map(c=>`<div class="card" onclick="subs(${c})"><h3>कक्षा ${c}</h3><p class="muted">Subjects & Chapters</p></div>`).join("")+'</div></div><div class="box"><h3>📊 Progress</h3><p>'+st.lessons+' lessons • '+st.tests+' tests</p><div class="progress"><div class="bar" style="width:'+Math.min(100,st.lessons*10)+'%"></div></div></div><div class="box"><h3>🤖 Doubt Solver</h3><button onclick="doubt()">खोलें</button></div>'}
function subs(c){app.innerHTML=`<button class="secondary" onclick="home()">← Home</button><div class="box"><h2>कक्षा ${c}</h2><div class="grid">${subjects[c].map(s=>`<div class="card" onclick="chap(${c},'${s}')"><h3>${s}</h3><p class="muted">Chapters</p></div>`).join("")}</div></div>`}
function chap(c,s){let a=["अध्याय 1","अध्याय 2","अध्याय 3","अध्याय 4","अध्याय 5","अध्याय 6"];app.innerHTML=`<button class="secondary" onclick="subs(${c})">← Subjects</button><div class="box"><h2>${s}</h2>${a.map(x=>`<div class="card"><h3>📖 ${x}</h3><button onclick="lesson(${c},'${s}','${x}')">Notes पढ़ें</button><button class="secondary" onclick="test('${s}','${x}')">MCQ</button></div>`).join("")}</div>`}
function lesson(c,s,x){app.innerHTML=`<button class="secondary" onclick="chap(${c},'${s}')">← Chapters</button><div class="box"><h2>${s} — ${x}</h2><h3>सरल Explanation</h3><p>इस अध्याय की मुख्य अवधारणाएँ समझें, महत्वपूर्ण शब्द याद करें और अभ्यास प्रश्न हल करें।</p><ul><li>मुख्य अवधारणा समझें</li><li>उदाहरण देखें</li><li>MCQ से अभ्यास करें</li></ul><button onclick="done()">✅ Lesson पूरा</button><button class="secondary" onclick="test('${s}','${x}')">MCQ Test</button></div>`}
function done(){st.lessons++;save();alert("Progress में जुड़ गया ✅");home()}
function test(s,x){let q=[["मुख्य अवधारणा समझने का सही तरीका?",["समझकर पढ़ना","सिर्फ अनुमान","पढ़ाई छोड़ना"],0],["अच्छी तैयारी के लिए?",["नियमित अभ्यास","कुछ नहीं","सिर्फ उत्तर याद करना"],0]];app.innerHTML='<button class="secondary" onclick="home()">← Home</button><div class="box"><h2>📝 MCQ Test</h2>'+q.map((z,i)=>`<div class="card"><b>${i+1}. ${z[0]}</b>${z[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}</div>`).join("")+'<button onclick="check()">Submit</button><p id="r"></p></div>'}
function check(){let score=0;document.querySelectorAll('input[type=radio]:checked').forEach(e=>{if(e.value==="0")score++});st.tests++;save();r.innerHTML='<b>स्कोर: '+score+'/2</b>'}
function doubt(){app.innerHTML='<button class="secondary" onclick="home()">← Home</button><div class="box"><h2>🤖 Doubt Solver</h2><textarea id="q" rows="5" placeholder="अपना सवाल लिखें..."></textarea><button onclick="solve()">समझाएँ</button><div id="ans"></div></div>'}
function solve(){ans.innerHTML=q.value.trim()?'<div class="box"><b>Study तरीका:</b><p>सवाल के मुख्य शब्द पहचानें, परिभाषा समझें, उदाहरण देखें और फिर अभ्यास करें।</p><small>यह offline demo है; असली AI जवाब के लिए online AI service/backend जोड़ना होगा।</small></div>':'<p>पहले सवाल लिखें।</p>'}
home();
</script></main></body></html>
